<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Player</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="navbar">
        <a href="/">Home (Queries)</a>
        <a href="/players">Manage Players</a>
        
        <div class="db-actions">
            <span>DB Actions:</span>
            <a href="/run_sql/drop" class="btn-db btn-db-drop" 
               onclick="return confirm('Are you sure you want to DROP all tables? This will delete all data.');">Drop Tables</a>
            <a href="/run_sql/create" class="btn-db btn-db-create">Create Tables</a>
            <a href="/run_sql/populate" class="btn-db btn-db-populate" 
               onclick="return confirm('This will insert all dummy data. Run this after Create Tables.');">Populate Tables</a>
        </div>
    </div>

    <h1>Edit {{ player['Name'] }}</h1>
    <div class="card">
        <form action="/player/edit/{{ player['PlayerID'] }}" method="POST">
            <label for="name">Name:</label>
            <input type="text" name="name" id="name" value="{{ player['Name'] }}" required>
            
            <label for="team_id">Team:</label>
            <select name="team_id" id="team_id" required>
                {% for team in teams %}
                <option value="{{ team['TeamID'] }}" {% if team['TeamID'] == player['TeamID'] %}selected{% endif %}>
                    {{ team['Name'] }}
                </option>
                {% endfor %}
            </select>
            
            <label for="position">Position:</label>
            <input type="text" name="position" id="position" value="{{ player['Position'] }}">
            
            <label for="nationality">Nationality:</label>
            <input type="text" name="nationality" id="nationality" value="{{ player['Nationality'] }}">
            
            <button type="submit" class="button-primary">Save Changes</button>
            <a href="/players" class="button-secondary">Cancel</a>
        </form>
    </div>
</body>
</html>
